# Catálogo de fuentes oficiales del corpus.
#
# Cada entrada: id oficial, abreviatura para citar (corta), de dónde se descarga (fuente) y por
# qué está aquí (motivo). Campos opcionales: territorio (ue | estatal | andalucia | municipal),
# municipio, clase (norma | jurisprudencia | doctrina), bloques (solo esos preceptos), estado
# (aviso de vigencia que se muestra con cada cita), origen (id en la fuente), desde/hasta.
#
# Toda entrada se verifica al sincronizar: si el id no existe en la fuente oficial, `vut sync`
# falla y no escribe nada.

