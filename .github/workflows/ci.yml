name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest --cov=vut_andalucia --cov-report=term-missing
      - name: Evaluación de recuperación (sin LLM)
        run: uv run vut eval
        env:
          VUT_CACHE_CONSULTAS: tests/fixtures/consultas-bge-m3.json
