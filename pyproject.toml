[project]
name = "vut-andalucia"
version = "0.1.0.dev0"
description = "Asistente legal con citas verificadas para viviendas de uso turístico (VUT) en Andalucía. RAG sobre BOE, BOJA y EUR-Lex."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alfonso Medela", email = "contact@alfonsomedela.com" }]
requires-python = ">=3.12"
keywords = ["rag", "legal-ai", "legaltech", "ollama", "vivienda-uso-turistico", "andalucia", "boe"]
classifiers = [
  "Programming Language :: Python :: 3.12",
  "Natural Language :: Spanish",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "httpx>=0.27",
  "numpy>=2.5.4",
  "pydantic>=2.7",
  "pypdf>=6.21.2",
  "pyyaml>=6.0",
  "snowballstemmer>=2.2",
  "typer>=0.12",
]

[project.scripts]
vut = "vut_andalucia.cli:app"

[project.urls]
Homepage = "https://alfonsomedela.com"
Repository = "https://github.com/alfonmedela/vut-andalucia"

[project.optional-dependencies]
claude = [
    "anthropic>=2.3.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "types-PyYAML"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vut_andalucia"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "BLE"]
# Texto legal en español: comillas «», rayas y tildes son intencionadas.
ignore = ["RUF001", "RUF002", "RUF003", "SIM905"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["ollama: requiere un servidor Ollama local"]

[[tool.mypy.overrides]]
module = ["playwright.*"]
ignore_missing_imports = true
