- id: a-multa-300000
  pregunta: He leído que si alquilas en Airbnb sin estar dado de alta como piso turístico las multas van
    de 3.000 a 300.000 euros. ¿Es así en Andalucía?
  origen: online:OP124
  fecha: '2026-10-26'
