    hay que cumplir la normativa urbanística y tener, cuando sea exigible, la licencia o DR urbanística
    del art. 6.1.a. La respuesta online (solo la DR) es incompleta en ese punto.'
- id: a-licencia-provisional
  pregunta: En Andalucía, cuando ya tienes toda la documentación y has solicitado la licencia turística,
    ¿puedes empezar a alquilar con la licencia provisional?
  origen: online:OP024
