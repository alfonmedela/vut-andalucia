  fecha: 2026-10-26
  fuentes: [BOE-A-1960-10906#da-3]
  cita: podrá seguir ejerciendo la actividad con las condiciones y plazos establecidos en la misma
  hechos: [seguir*|continuar*]

- id: lph-cesacion
