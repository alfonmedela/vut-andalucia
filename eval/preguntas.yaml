- id: a-gestora-explotadora
  pregunta: En Andalucía, un property manager publica las viviendas en Booking y Airbnb, hace la limpieza,
    gestiona las fianzas y el check-in con un contrato de 'prestación de servicios' con el propietario.
    ¿El explotador sigue siendo el propietario?
  origen: chat:obs-113
  fecha: '2026-10-26'
  fuentes:
  - BOJA-D-2016-28#art3.2
  - BOJA-D-2016-28#art4
  - JUNTA-FAQ-VUT#p21
  cita: se presumirá la administración y gestión del alojamiento cuando se desarrollen los principales
    servicios inherentes al hospedaje
  hechos:
  - empresa explotadora|titular de la explotación
  no_debe:
  - el propietario sigue siendo el explotador
  tipo: premisa_falsa
  nota_juridica: Según el art. 3.2 del Decreto 28/2016, es empresa explotadora quien sea cesionaria de
    la gestión "con independencia del título habilitante". La gestión se presume si presta los servicios
    inherentes (llaves, recepción, limpieza, facturación…), y esa empresa debe figurar como titular de
    la explotación en la DR (arts. 3.2 y 4.1). Coincide con el abogado.
