    para tener por cumplido el deber de inscripción y permite iniciar la actividad (art. 38.2 Ley 13/2011,
    art. 13.1 Decreto 143/2014, art. 9.1 Decreto 28/2016). Eso no quita la licencia o DR urbanística del
    art. 6.1.a cuando sea exigible.
