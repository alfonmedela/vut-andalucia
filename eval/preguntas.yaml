# Set de evaluación. Cada caso en ámbito lleva:
#   fuentes: fragmentos (sin versión) que una buena respuesta debe citar; basta con uno.
#   cita:    frase literal del texto oficial que prueba la respuesta. tests/test_eval_set.py
#            comprueba que aparece en el fragmento vigente en `fecha`: si el BOE cambia la
#            norma, el test falla y obliga a revisar la pregunta.
#   hechos:  datos clave que deben aparecer en lo que AFIRMA el modelo (no en la cita, que ya
#            es texto legal), por palabras completas. "a|b" acepta alternativas; "pal*" es prefijo.
#   no_debe: (opcional) frases que, si aparecen en lo afirmado, hacen fallar el caso.
# Los casos fuera de ámbito comprueban que el asistente se abstiene.

- id: lph-permiso-comunidad
  pregunta: ¿Necesito permiso de la comunidad de propietarios para alquilar mi piso como vivienda turística?
  fecha: 2026-10-26
  fuentes: [BOE-A-1960-10906#aseptimo.3, BOE-A-1960-10906#adiecisiete.12]
  cita: deberá obtener previamente la aprobación expresa de la comunidad de propietarios
  hechos: [aprobación*|permiso|autoriza*]

- id: lph-mayoria
  pregunta: ¿Qué mayoría hace falta en la junta para aprobar o prohibir los pisos turísticos en el edificio?
  fecha: 2026-10-26
  fuentes: [BOE-A-1960-10906#adiecisiete.12]
  cita: requerirá el voto favorable de las tres quintas partes del total de los propietarios
  hechos: [tres quintas partes|3/5]

- id: lph-cuotas-especiales
  pregunta: ¿Puede la comunidad cobrar más gastos comunes a la vivienda turística? ¿Hay un límite?
  fecha: 2026-10-26
  fuentes: [BOE-A-1960-10906#adiecisiete.12]
  cita: siempre que estas modificaciones no supongan un incremento superior al 20 %
  hechos: ["20"]

- id: lph-no-retroactivo
  pregunta: Si la junta prohíbe los pisos turísticos, ¿el acuerdo tiene efectos retroactivos?
  fecha: 2026-10-26
  fuentes: [BOE-A-1960-10906#adiecisiete.12, BOE-A-1960-10906#da-3]
  cita: Estos acuerdos no tendrán efectos retroactivos
  hechos: [no tendrán efectos retroactivos|no tienen efectos retroactivos|no tiene efectos retroactivos|no tendrá efectos retroactivos|no es retroactiv*|no son retroactiv*|sin efectos retroactivos]

- id: lph-actividad-previa
