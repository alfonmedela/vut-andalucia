    3.000 a 300.000 € no salen de la norma andaluza. El art. 79.3 permite subir la multa hasta el triple
    del precio de los servicios afectados.'
- id: a-inspeccion-aviso
  pregunta: ¿Cómo son las inspecciones de la Junta de Andalucía a las viviendas turísticas? ¿Avisan antes
    o se presentan directamente en la vivienda?
  origen: chat:obs-151
  fecha: '2026-10-26'
  fuentes:
  - BOE-A-2012-876#a6-8.2
  - BOE-A-2012-876#a6-8.1
  - BOE-A-2012-876#a6-6.2
  cita: el personal inspector dejará a quien esté presente un requerimiento, indicando el plazo en que
    procederá a realizar la inspección, nunca inferior a veinticuatro horas
  hechos:
  - acceso
  - veinticuatro horas|24 horas
  tipo: normal
  nota_juridica: La ley no exige aviso previo. El titular debe facilitar el acceso y la documentación
    (art. 66.1 Ley 13/2011). Si no está, el inspector deja un requerimiento con un plazo de al menos 24
    h (art. 66.2). Los inspectores son agentes de la autoridad (art. 64.2), y dificultar la inspección
    es infracción grave (art. 71.22) o muy grave (art. 72.3). Es compatible con el abogado ("depende del
    inspector").
