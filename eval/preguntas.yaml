- id: a-50m2-un-bano
  pregunta: Tengo un piso turístico en Málaga capital de unos 50 m2, registrado con 6 plazas y un solo
    baño. Con la normativa actual, ¿cuántas plazas puedo tener?
  origen: chat:obs-160
  fecha: '2026-10-26'
  fuentes:
  - BOJA-D-2016-28#art6.1
  - JUNTA-FAQ-VUT#p18
  cita: Disponer de dos baños si el número de plazas es superior a cinco y de tres baños si el número
    de plazas es superior a ocho.
  hechos:
  - 3 plazas|tres plazas
  - dos baños|2 baños
  tipo: caso_limite
  nota_juridica: Con 14 m² construidos de uso principal por plaza (art. 6.1.b), 50 m² dan 3 plazas (50/14
    = 3,57). Además, más de 5 plazas exigen 2 baños (art. 6.1.c), así que 6 plazas con 1 baño incumplen
    por partida doble. El abogado habla de "3 o 4 plazas" y de un plazo de adaptación vencido el 22-8-2024
    (DA del Decreto 31/2024), que no está en el corpus. Si el Catastro da otra superficie, el cálculo
    cambia.
