  - MALAGA-INSTRUCCION-1-2024#texto-p3.0
  cita: Cumplir con la normativa urbanística municipal y disponer, cuando resulte aplicable de conformidad
    con lo previsto en el artículo 6 del Decreto-ley de medidas urgentes en materia de vivienda
  hechos:
